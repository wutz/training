# Minimal stand-in for the Kubeflow Trainer TrainJob CRD (trainer.kubeflow.org/v1alpha1).
#
# The operator watches TrainJob objects and cannot start its informer without this CRD,
# so unit tests (envtest), e2e tests and the Helm chart test install it first.
# Real clusters should install the Kubeflow Trainer release instead.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: trainjobs.trainer.kubeflow.org
spec:
  group: trainer.kubeflow.org
  names:
    kind: TrainJob
    listKind: TrainJobList
    plural: trainjobs
    singular: trainjob
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
