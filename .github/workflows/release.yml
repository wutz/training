name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. v0.2.0
        required: true
        type: string

permissions: {}

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - name: Validate release tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          IS_STABLE_RELEASE: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Release tag must be SemVer with a v prefix, got: $TAG"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=${BASH_REMATCH[1]}"
            echo "latest=$IS_STABLE_RELEASE"
          } >> "$GITHUB_OUTPUT"

  image:
    name: Build and push container image
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.latest == 'true' }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Package and push Helm chart
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Lint Helm chart
        run: helm lint dist/chart

      - name: Package Helm chart
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          CHART_VERSION: ${{ needs.prepare.outputs.version }}
          APP_VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          # Default the manager image to the one published by the image job, tagged with the release
          yq -i '.manager.image.repository = strenv(IMAGE_REPOSITORY)' dist/chart/values.yaml
          helm package dist/chart --version "$CHART_VERSION" --app-version "$APP_VERSION" --destination dist/packages

      - name: Log in to GitHub Container Registry
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

      - name: Push Helm chart
        env:
          OWNER: ${{ github.repository_owner }}
        run: helm push dist/packages/*.tgz "oci://ghcr.io/$OWNER/charts"
